spring:
  application:
    name: broker
  datasource:
    url: jdbc:postgresql://localhost:5432/broker
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true


broker:
  publisher:
    keep-alive:
      timeout-ms: 30000
      check-period-ms: 5000
  consumer:
    keep-alive:
      timeout-ms: 30000
      check-period-ms: 5000
  dispatch:
    threads: 2


  

