spring:
  application:
    name: broker
  datasource:
    url: jdbc:sqlite:broker.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true

grpc:
  server:
    port: 6565

broker:
  dispatch:
    threads: 2


  

