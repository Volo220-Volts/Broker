


spring:
  application:
    name: broker
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
   
    hibernate:
      ddl-auto: create
    show-sql: true

grpc:
  server:
    port: 6565

broker:
  publisher:
    keep-alive:
      timeout-ms: 30000
      check-period-ms: 5000
  consumer:
    keep-alive:
      timeout-ms: 30000
      check-period-ms: 5000
  dispatch:
    threads: 2


  

