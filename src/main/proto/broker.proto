syntax = "proto3";

package broker;

option java_multiple_files = true;
option java_package = "com.custombroker.grpc";
option java_outer_classname = "BrokerProto";


service PublisherService {
  rpc OpenPublisherChannel(stream PublisherRequest) returns (stream PublisherResponse);
}

service ConsumerService {
  rpc OpenChannel(stream ConsumerRequest) returns (stream BrokerResponse);
}

service QueueService {
  rpc DeclareQueue(DeclareQueueRequest) returns (QueueOperationResponse);
  rpc DeleteQueue(DeleteQueueRequest) returns (QueueOperationResponse);
}

enum DeliveryGuarantee {
  DELIVERY_GUARANTEE_UNSPECIFIED = 0;
  AT_MOST_ONCE = 1;
  AT_LEAST_ONCE = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  INVALID_REQUEST = 1;
  PAYLOAD_TOO_LARGE = 2;
  UNSUPPORTED_DELIVERY_GUARANTEE = 3;
  INTERNAL_ERROR = 4;
}

message PublisherRequest {
  oneof request {
    PublishAction publish = 1;
    KeepAlive ping = 2;
    ClosePublisherAction close = 3;
  }
}

message PublisherResponse {
  oneof response {
    PublishAck ack = 1;
    PublishNack nack = 2;
    KeepAlive pong = 3;
  }
}

message PublishAction {
  string client_publish_id = 1;
  string exchange = 2;
  string routing_key = 3;
  bytes payload = 4;
  map<string, string> headers = 5;
  DeliveryGuarantee delivery_guarantee = 6;
}

message PublishAck {
  string client_publish_id = 1;
  int64 message_id = 2;
}

message PublishNack {
  string client_publish_id = 1;
  ErrorInfo error = 2;
}

message ClosePublisherAction {
  string reason = 1;
}

message ConsumerRequest {
  oneof request {
    SubscribeAction subscribe = 1;
    AckAction ack = 2;
    NackAction nack = 3;
    KeepAlive ping = 4;
  }
}

message BrokerResponse {
  oneof response {
    MessageDelivery delivery = 1;
    KeepAlive pong = 2;
    ErrorInfo error = 3;
  }
}

message SubscribeAction {
  string queue_name = 1;
  int32 prefetch_count = 2;
}

message AckAction {
  int64 delivery_tag = 1;
  int64 message_id = 2;
}

message NackAction {
  int64 delivery_tag = 1;
  int64 message_id = 2;
  bool requeue = 3;
}

message MessageDelivery {
  int64 delivery_tag = 1;
  Message message = 2;
  bool redelivered = 3;
  int32 delivery_attempt = 4;
}

message Message {
  int64 id = 1;
  bytes payload = 2;
  string routing_key = 3;
  map<string, string> headers = 4;
  int64 timestamp = 5;
}

message KeepAlive {
  int64 timestamp = 1;
}

message ErrorInfo {
  ErrorCode code = 1;
  string message = 2;
  map<string, string> details = 3;
}

message DeclareQueueRequest {
  string queue_path = 1;
}

message DeleteQueueRequest {
  string queue_path = 1;
}

message QueueOperationResponse {
  bool success = 1;
  ErrorInfo error = 2;
}
